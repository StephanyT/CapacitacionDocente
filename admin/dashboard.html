<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/x-icon" href="../img/favicon_certus.ico">

<title>CERTUS | Dashboard Admin</title>
<link rel="stylesheet" href="../css/theme.css">
</head>
<body>
<div class="app">
  <nav class="topnav">
    <div class="topnav-left"><img src="../img/certus_logo.png" alt="CERTUS" class="brand-logo"><span class="brand-divider"></span><span class="brand-label">Panel Admin</span></div>
    <div class="topnav-links">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="gestion_capacitaciones.html">Gestion de capacitaciones</a>
      <a href="gestion_docentes.html">Gestion de docentes</a>
      <a href="gestion_administradores.html">Administradores</a>
      <a href="reportes.html">Reportes</a>
      <a href="mentores.html">Mentores</a>
    </div>
    <div class="topnav-right" id="topnavRight"></div>
  </nav>

  <main class="main">
    <div class="topbar">
      <h1>Panel administrador</h1>
    </div>

    <div class="card" id="cardAccionesPendientes"></div>

    <div class="grid-4 stagger" id="metricas"></div>

    <div class="modal-overlay" id="modalRevisionEvidencia">
      <div class="modal-box" style="width:420px;text-align:left;">
        <h3><i class="fa-solid fa-file-circle-check"></i> Revisar evidencia</h3>
        <div id="revisionEvidenciaBody"></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2><i class="fa-solid fa-chart-column"></i> Estado de las capacitaciones</h2>
        <canvas id="chartEstados" height="160"></canvas>
      </div>
      <div class="card" id="tarjetaSemaforo">
        <h2><i class="fa-solid fa-traffic-light"></i> Semaforo de cumplimiento</h2>
        <table>
          <thead><tr><th></th><th>Docente</th><th>Capacitacion</th><th>Estado</th><th>Fecha limite</th><th></th></tr></thead>
          <tbody id="tablaSemaforo"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="../js/data.js?v=20260916n"></script>
<script src="../js/app.js?v=20260916n"></script>
<script>
  const sesion = requireSesion("admin");

  // ===== Requiere tu atencion: cola consolidada de acciones pendientes =====
  // Antes de esto, un admin tenia que entrar a "Gestion de capacitaciones"
  // (solicitudes y sugerencias) Y abrir uno por uno cada perfil de docente
  // en "Gestion de docentes" (evidencias) para enterarse de que habia algo
  // pendiente de revisar. Las 3 funciones ya existian en app.js, pero
  // todasLasEvidenciasPendientes() nunca se llamaba desde ninguna pagina.
  // Patron: bandeja de aprobaciones al frente del dashboard, como en
  // Frontline Central / MyLearningPlan (EE.UU.). Separada en su propia
  // funcion (en vez de vivir solo dentro de iniciarDashboard) para poder
  // volver a pintarla despues de aprobar/rechazar una evidencia sin recargar
  // toda la pagina.
  function renderAccionesPendientes(){
    const solicitudesPend = todasLasSolicitudesPendientes();
    const ampliacionPend = todasLasSolicitudesAmpliacionPendientes();
    const sugerenciasPend = todasLasSugerencias().filter(s => s.estado !== "atendida");
    const evidenciasPend = todasLasEvidenciasPendientes();
    // Antes esto vivia en una tarjeta separada ("Resumen inteligente") justo
    // encima de esta -- dos cajas que ambas decian "requiere tu atencion" de
    // formas distintas, una sin ninguna accion posible. Ahora es una fila
    // mas de esta misma bandeja, con el mismo patron de icono + contador +
    // nombres que las demas.
    const vencidos = INSCRIPCIONES.filter(i => semaforoClase(i) === "semaforo-rojo");
    const porVencer = INSCRIPCIONES.filter(i => semaforoClase(i) === "semaforo-ambar");
    const totalPendiente = solicitudesPend.length + ampliacionPend.length + sugerenciasPend.length + evidenciasPend.length + vencidos.length + porVencer.length;

    const cardAcciones = document.getElementById("cardAccionesPendientes");
    if(totalPendiente === 0){
      cardAcciones.innerHTML = `
        <h2><i class="fa-solid fa-clipboard-check"></i> Requiere tu atencion</h2>
        <p style="font-size:12.5px;color:var(--text-muted);"><i class="fa-solid fa-circle-check" style="color:var(--success);"></i> Todos los docentes estan al dia y no tienes solicitudes, sugerencias ni evidencias pendientes de revisar.</p>
      `;
      return;
    }
    const filas = [];
    if(vencidos.length){
      filas.push(`
        <a class="review-item" href="#tarjetaSemaforo" style="display:block;text-decoration:none;color:inherit;border-left:3px solid var(--danger);">
          <div class="r-head"><span><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger);"></i> Capacitaciones vencidas sin completar</span><span class="badge badge-vencido">${vencidos.length}</span></div>
          <p>${[...new Set(vencidos.map(i => nombreDocente(i.id_docente)))].join(", ")}</p>
        </a>
      `);
    }
    if(porVencer.length){
      filas.push(`
        <a class="review-item" href="#tarjetaSemaforo" style="display:block;text-decoration:none;color:inherit;">
          <div class="r-head"><span><i class="fa-solid fa-clock"></i> Capacitaciones por vencer pronto</span><span class="badge badge-pendiente">${porVencer.length}</span></div>
          <p>${[...new Set(porVencer.map(i => nombreDocente(i.id_docente)))].join(", ")}</p>
        </a>
      `);
    }
    if(solicitudesPend.length){
      filas.push(`
        <a class="review-item" href="gestion_capacitaciones.html" style="display:block;text-decoration:none;color:inherit;">
          <div class="r-head"><span><i class="fa-solid fa-inbox"></i> Solicitudes de acceso a capacitaciones</span><span class="badge badge-pendiente">${solicitudesPend.length}</span></div>
          <p>${[...new Set(solicitudesPend.map(s => nombreDocente(s.id_docente)))].join(", ")}</p>
        </a>
      `);
    }
    if(ampliacionPend.length){
      filas.push(`
        <a class="review-item" href="gestion_capacitaciones.html" style="display:block;text-decoration:none;color:inherit;">
          <div class="r-head"><span><i class="fa-solid fa-calendar-plus"></i> Solicitudes de ampliacion de plazo</span><span class="badge badge-vencido">${ampliacionPend.length}</span></div>
          <p>${[...new Set(ampliacionPend.map(s => s.docente ? `${s.docente.nombres} ${s.docente.apellidos}` : "-"))].join(", ")}</p>
        </a>
      `);
    }
    if(sugerenciasPend.length){
      filas.push(`
        <a class="review-item" href="gestion_capacitaciones.html" style="display:block;text-decoration:none;color:inherit;">
          <div class="r-head"><span><i class="fa-solid fa-lightbulb"></i> Sugerencias de tema de capacitacion</span><span class="badge badge-pendiente">${sugerenciasPend.length}</span></div>
          <p>${[...new Set(sugerenciasPend.map(s => nombreDocente(s.id_docente)))].join(", ")}</p>
        </a>
      `);
    }
    if(evidenciasPend.length){
      // A diferencia de solicitudes/sugerencias (que llevan a Gestion de
      // capacitaciones), esto abre un modal rapido aqui mismo en el
      // Dashboard: aprobar/rechazar una evidencia es una decision puntual
      // (leer un texto corto y decidir) que no necesita el perfil completo
      // del docente ni sacar al admin de la bandeja de pendientes — mismo
      // patron de "resolver sin salir de la bandeja" que usan sistemas
      // reales de aprobaciones (Frontline Central, Workday).
      filas.push(`
        <div class="review-item">
          <div class="r-head"><span><i class="fa-solid fa-file-circle-check"></i> Evidencias de insignias por revisar</span><span class="badge badge-pendiente">${evidenciasPend.length}</span></div>
          <p>
            ${evidenciasPend.map(e => `<a href="javascript:void(0)" onclick="abrirRevisionEvidencia(${e.id})" style="color:var(--info);">${nombreDocente(e.id_docente)}</a>`).join(", ")}
          </p>
        </div>
      `);
    }
    cardAcciones.innerHTML = `<h2><i class="fa-solid fa-clipboard-check"></i> Requiere tu atencion</h2>${filas.join("")}`;
  }

  function abrirRevisionEvidencia(idEvidencia){
    const e = EVIDENCIAS_INSIGNIA.find(x => x.id === idEvidencia);
    if(!e) return;
    const ins = INSIGNIAS.find(x => x.id === e.id_insignia);
    document.getElementById("revisionEvidenciaBody").innerHTML = `
      <p style="font-size:12.5px;color:var(--text-muted);margin-bottom:.75rem;">
        <b style="color:var(--text);">${nombreDocente(e.id_docente)}</b> quiere la insignia <b style="color:var(--text);">${ins ? ins.nombre : "Insignia"}</b> · enviada el ${e.fecha}
      </p>
      <p style="font-size:13px;background:var(--bg);padding:10px 12px;border-radius:8px;line-height:1.5;margin-bottom:1.1rem;">${e.texto}</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="cerrarRevisionEvidencia()"><i class="fa-solid fa-xmark"></i> Cerrar</button>
        <button class="btn btn-outline" onclick="resolverEvidencia(${e.id}, 'rechazada', this)"><i class="fa-solid fa-ban"></i> Rechazar</button>
        <button class="btn btn-primary" onclick="resolverEvidencia(${e.id}, 'aprobada', this)"><i class="fa-solid fa-check"></i> Aprobar</button>
      </div>
    `;
    document.getElementById("modalRevisionEvidencia").classList.add("open");
  }
  function cerrarRevisionEvidencia(){
    document.getElementById("modalRevisionEvidencia").classList.remove("open");
  }
  async function resolverEvidencia(idEvidencia, estado, boton){
    try{
      await conEstadoCarga(boton, estado === "aprobada" ? "Aprobando..." : "Rechazando...", async () => {
        await cambiarEstadoEvidenciaBackend(idEvidencia, estado);
        await listarEvidenciasBackend();
      });
      cerrarRevisionEvidencia();
      renderAccionesPendientes();
      // Refresca tambien el conteo de la campanita del topnav, que lee de
      // los mismos datos (ver refrescarNotificaciones() en app.js).
      if(typeof refrescarNotificaciones === "function") refrescarNotificaciones(sesion);
      showToast(estado === "aprobada" ? "Evidencia aprobada — insignia otorgada" : "Evidencia rechazada", estado === "aprobada" ? "success" : "info");
    }catch(error){
      showToast(error.message, "error");
    }
  }

  async function iniciarDashboard(){
  try{
  // Bug real: nunca se cargaban MENTORES ni las evidencias de insignias, asi
  // que "Mentores activos" siempre mostraba 0 y la cola de "Requiere tu
  // atencion" nunca contaba evidencias pendientes. INSIGNIAS se suma ahora
  // tambien, para poder mostrar el nombre de la insignia en el modal rapido
  // de revision de evidencia. listarSolicitudesBackend() se agrega porque
  // todasLasSolicitudesPendientes() (usada mas abajo) ya no lee de
  // localStorage sino del arreglo real SOLICITUDES_CAPACITACION — sin esta
  // carga, la cola de solicitudes pendientes siempre habria mostrado 0.
  await Promise.all([listarDocentesBackend(), listarInscripcionesBackend(), listarConstanciasBackend(), listarMentoresBackend(), listarEvidenciasBackend(), listarInsigniasBackend(), listarSolicitudesBackend(), listarSugerenciasBackend(), listarSolicitudesAmpliacionBackend()]);
  const capacitaciones = await listarCapacitacionesBackend();

  const totalDocentes = DOCENTES.length;
  const totalCapacitaciones = capacitaciones.filter(c => c.activo).length;
  const completadas = INSCRIPCIONES.filter(i => i.estado === "completada").length;
  const enCurso = INSCRIPCIONES.filter(i => i.estado === "en curso").length;
  const pendientes = INSCRIPCIONES.filter(i => i.estado === "pendiente").length;
  // Bug real encontrado al vaciar los datos para la demo: con 0 inscripciones
  // esto daba NaN% (division entre cero) en vez de 0%.
  const avance = INSCRIPCIONES.length ? Math.round(completadas / INSCRIPCIONES.length * 100) : 0;

  document.getElementById("metricas").innerHTML = `
    <div class="card metric"><div class="icon-wrap"><i class="fa-solid fa-users"></i></div><div class="num" id="numDocentes">0</div><div class="label">Docentes</div></div>
    <div class="card metric"><div class="icon-wrap"><i class="fa-solid fa-chalkboard-user"></i></div><div class="num" id="numCapacitaciones">0</div><div class="label">Capacitaciones activas</div></div>
    <div class="card metric"><div class="icon-wrap"><i class="fa-solid fa-chart-pie"></i></div><div class="num" id="numAvance">0%</div><div class="label">Avance global</div></div>
    <div class="card metric"><div class="icon-wrap"><i class="fa-solid fa-people-group"></i></div><div class="num" id="numMentores">0</div><div class="label">Mentores activos</div></div>
  `;
  // NOTA: antes habia aqui una tarjeta separada de "Resumen inteligente"
  // que repetia el conteo de vencidas/por vencer con su propio tag
  // "Requiere atencion" -- dos cajas con el mismo mensaje, una de ellas sin
  // ninguna accion posible. Esa alerta ahora vive como una fila mas dentro
  // de renderAccionesPendientes(), la unica bandeja de "Requiere tu
  // atencion" de la pagina.
  renderAccionesPendientes();

  animateCount(document.getElementById("numDocentes"), totalDocentes);
  animateCount(document.getElementById("numCapacitaciones"), totalCapacitaciones);
  animateCount(document.getElementById("numAvance"), avance, "%");
  animateCount(document.getElementById("numMentores"), MENTORES.length);

  new Chart(document.getElementById("chartEstados"), {
    type: "bar",
    data: {
      labels: ["Pendiente", "En curso", "Completada"],
      datasets: [{
        data: [pendientes, enCurso, completadas],
        backgroundColor: ["#f0ad4e", "#008196", "#64a44e"],
        borderRadius: 6,
        maxBarThickness: 46
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
  });

  // Ordenado por urgencia (rojo primero, luego ambar, luego verde) en vez del
  // orden de insercion: con 28 inscripciones, un admin no deberia tener que
  // escanear toda la tabla para encontrar lo vencido.
  const ordenUrgencia = {"semaforo-rojo": 0, "semaforo-ambar": 1, "semaforo-verde": 2};
  const inscripcionesOrdenadas = [...INSCRIPCIONES].sort((a, b) => ordenUrgencia[semaforoClase(a)] - ordenUrgencia[semaforoClase(b)]);
  // El nombre enlaza al perfil del docente (correo, telefono, historial):
  // contactarlo es un proceso manual del admin fuera del sistema (no hay
  // ningun RF de mensajeria/notificaciones, y la seccion 7.2 del documento
  // de requisitos excluye integraciones externas) — lo que si le toca al
  // sistema es dejarle a mano los datos de contacto en un clic.
  document.getElementById("tablaSemaforo").innerHTML = inscripcionesOrdenadas.map(i => `
    <tr>
      <td><span class="semaforo ${semaforoClase(i)}"></span></td>
      <td><a href="gestion_docentes.html?docente=${i.id_docente}" style="color:var(--info);">${nombreDocente(i.id_docente)}</a></td>
      <td>${nombreCapacitacion(i.id_capacitacion)}</td>
      <td>${semaforoTexto(i)}</td>
      <td>${i.estado === "completada" ? "-" : (i.fecha_limite || "sin fecha")}</td>
      <td>${i.estado === "completada" ? "" : `<a href="gestion_capacitaciones.html?docentes=${i.id_capacitacion}" style="font-size:12px;color:var(--info);white-space:nowrap;"><i class="fa-solid fa-arrow-right"></i> Gestionar</a>`}</td>
    </tr>
  `).join("");
  }catch(error){
    document.getElementById("metricas").innerHTML =
      `<div class="card"><p style="font-size:13px;color:#c62828;">${error.message}</p></div>`;
  }
  }

  iniciarDashboard();
</script>
</body>
</html>
