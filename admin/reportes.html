<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/x-icon" href="../img/favicon_certus.ico">

<title>CERTUS | Reportes</title>
<link rel="stylesheet" href="../css/theme.css">
</head>
<body>
<div class="app">
  <nav class="topnav">
    <div class="topnav-left"><img src="../img/certus_logo.png" alt="CERTUS" class="brand-logo"><span class="brand-divider"></span><span class="brand-label">Panel Admin</span></div>
    <div class="topnav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="gestion_capacitaciones.html">Gestion de capacitaciones</a>
      <a href="gestion_docentes.html">Gestion de docentes</a>
      <a href="gestion_administradores.html">Administradores</a>
      <a href="reportes.html" class="active">Reportes</a>
      <a href="mentores.html">Mentores</a>
    </div>
    <div class="topnav-right" id="topnavRight"></div>
  </nav>

  <main class="main">
    <div class="topbar">
      <h1>Reportes</h1>
      <button class="btn btn-outline" id="btnExportarReporte"><i class="fa-solid fa-file-export"></i> Exportar CSV</button>
    </div>

    <div class="card">
      <div class="grid-4">
        <div class="form-group"><label>Sede</label>
          <select id="fSede"><option value="todas">Todas</option><option>Lima Centro</option><option>Lima Norte</option><option>Arequipa</option><option>Aula Virtual</option></select>
        </div>
        <div class="form-group"><label>Programa</label>
          <select id="fPrograma"><option value="todas">Todos</option><option>Diseño y Desarrollo de Software</option><option>Administracion</option><option>Marketing</option><option>Idiomas</option><option>Psicologia</option></select>
        </div>
        <div class="form-group"><label>Docente</label>
          <select id="fDocente"><option value="todas">Todos</option></select>
        </div>
        <div class="form-group"><label>Estado</label>
          <select id="fEstado"><option value="todas">Todos</option><option>pendiente</option><option>en curso</option><option>completada</option><option>vencida</option></select>
        </div>
      </div>
      <div class="grid-4" style="margin-top:.25rem;">
        <div class="form-group"><label><i class="fa-solid fa-calendar-day"></i> Periodo desde</label>
          <input type="date" id="fDesde">
        </div>
        <div class="form-group"><label><i class="fa-solid fa-calendar-day"></i> Periodo hasta</label>
          <input type="date" id="fHasta">
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end;">
          <button class="btn btn-outline btn-sm" onclick="limpiarPeriodo()" style="width:100%;"><i class="fa-solid fa-rotate-left"></i> Limpiar periodo</button>
        </div>
      </div>
    </div>

    <table>
      <thead><tr><th></th><th>Docente</th><th>Capacitacion</th><th>Sede</th><th>Programa</th><th>Estado</th><th>Fecha de inicio</th><th>Fecha limite</th><th>Fecha de finalizacion</th></tr></thead>
      <tbody id="tablaReporte"></tbody>
    </table>
    <nav aria-label="Paginacion de reportes" style="margin-top:1rem;">
      <ul class="pager" id="paginacionReportes"></ul>
    </nav>
  </main>
</div>

<script src="../js/data.js?v=20260916n"></script>
<script src="../js/app.js?v=20260916n"></script>
<script>
  requireSesion("admin");

  let docentesReporte = [];
  let filasActuales = [];

  // Paginacion — solo pagina lo que se ve en pantalla;
  // filasActuales sigue teniendo TODAS las filas filtradas (sin recortar),
  // porque exportarCSV() debe exportar el filtro completo, no solo la pagina visible.
  const REPORTE_POR_PAGINA = 8;
  let paginaActualReportes = 1;

  function cambiarPaginaReportes(pagina){
    paginaActualReportes = pagina;
    renderTablaReporte();
    window.scrollTo({top: 0, behavior: "smooth"});
  }

  function escaparHTML(valor){
    return String(valor ?? "").replace(/[&<>"']/g, caracter => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[caracter]));
  }

  function fechaCorta(fecha){
    return fecha ? String(fecha).slice(0, 10) : "";
  }

  function semaforoClaseReporte(registro){
    if(registro.estado !== "completada" && !registro.fecha_limite) return "semaforo-verde";
    return semaforoClase(registro);
  }

  function semaforoTextoReporte(registro){
    if(registro.estado !== "completada" && !registro.fecha_limite) return "Sin fecha limite";
    return semaforoTexto(registro);
  }

  function normalizarRegistroReporte(registro){
    return {
      id: parseInt(registro.id_inscripcion, 10),
      id_docente: parseInt(registro.id_docente, 10),
      id_capacitacion: parseInt(registro.id_capacitacion, 10),
      docente: registro.docente || "-",
      capacitacion: registro.capacitacion || "-",
      estado: registro.estado || "",
      fecha_inscripcion: fechaCorta(registro.fecha_inscripcion),
      fecha_limite: fechaCorta(registro.fecha_limite),
      fecha_finalizacion: fechaCorta(registro.fecha_finalizacion),
      sede: registro.sede || "-",
      programa: registro.programa || "-"
    };
  }

  function cargarDocentesReporte(){
    const select = document.getElementById("fDocente");
    const seleccionado = select.value || "todas";
    const opciones = docentesReporte.map(d => {
      const nombre = `${d.nombres || ""} ${d.apellidos || ""}`.trim();
      return `<option value="${d.id}">${escaparHTML(nombre)}</option>`;
    }).join("");
    select.innerHTML = `<option value="todas">Todos</option>${opciones}`;
    select.value = docentesReporte.some(d => String(d.id) === String(seleccionado)) ? seleccionado : "todas";
  }

  function parametrosReporte(){
    const params = new URLSearchParams();
    const filtros = [
      ["sede", document.getElementById("fSede").value],
      ["programa", document.getElementById("fPrograma").value],
      ["docente", document.getElementById("fDocente").value],
      ["estado", document.getElementById("fEstado").value],
      ["desde", document.getElementById("fDesde").value],
      ["hasta", document.getElementById("fHasta").value]
    ];

    filtros.forEach(([clave, valor]) => {
      if(valor && valor !== "todas") params.set(clave, valor);
    });

    return params.toString();
  }

  function renderPaginacionReportes(totalPaginas){
    const cont = document.getElementById("paginacionReportes");
    if(!cont) return;
    if(totalPaginas <= 1){ cont.innerHTML = ""; return; }
    let html = `<li class="pager-item ${paginaActualReportes === 1 ? "disabled" : ""}">
      <a class="pager-link" href="#" onclick="event.preventDefault();cambiarPaginaReportes(${paginaActualReportes - 1})">Anterior</a>
    </li>`;
    for(let p = 1; p <= totalPaginas; p++){
      html += `<li class="pager-item ${p === paginaActualReportes ? "active" : ""}">
        <a class="pager-link" href="#" onclick="event.preventDefault();cambiarPaginaReportes(${p})">${p}</a>
      </li>`;
    }
    html += `<li class="pager-item ${paginaActualReportes === totalPaginas ? "disabled" : ""}">
      <a class="pager-link" href="#" onclick="event.preventDefault();cambiarPaginaReportes(${paginaActualReportes + 1})">Siguiente</a>
    </li>`;
    cont.innerHTML = html;
  }

  function renderTablaReporte(){
    const totalPaginas = Math.max(1, Math.ceil(filasActuales.length / REPORTE_POR_PAGINA));
    if(paginaActualReportes > totalPaginas) paginaActualReportes = totalPaginas;
    const inicio = (paginaActualReportes - 1) * REPORTE_POR_PAGINA;
    const filas = filasActuales.slice(inicio, inicio + REPORTE_POR_PAGINA);

    document.getElementById("tablaReporte").innerHTML = filas.map(i => {
      const fechaFin = i.fecha_finalizacion || "-";
      return `<tr>
        <td><span class="semaforo ${semaforoClaseReporte(i)}" title="${escaparHTML(semaforoTextoReporte(i))}"></span></td>
        <td><a href="gestion_docentes.html?docente=${i.id_docente}" style="color:var(--info);">${escaparHTML(i.docente)}</a></td>
        <td>${escaparHTML(i.capacitacion)}</td>
        <td>${escaparHTML(i.sede)}</td>
        <td>${escaparHTML(i.programa)}</td>
        <td><span class="badge ${badgeClase(i.estado)}">${escaparHTML(badgeTexto(i.estado))}</span></td>
        <td>${escaparHTML(i.fecha_inscripcion || "-")}</td>
        <td>${escaparHTML(i.fecha_limite || "-")}</td>
        <td>${escaparHTML(fechaFin)}</td>
      </tr>`;
    }).join("") || `<tr><td colspan="9" style="text-align:center;color:#6a737b;">No hay registros para mostrar</td></tr>`;

    renderPaginacionReportes(totalPaginas);
  }

  function render(){
    paginaActualReportes = 1;
    renderTablaReporte();
  }
  ["fSede","fPrograma","fDocente","fEstado","fDesde","fHasta"].forEach(id => document.getElementById(id).addEventListener("change", cargarReporte));

  function limpiarPeriodo(){
    document.getElementById("fDesde").value = "";
    document.getElementById("fHasta").value = "";
    cargarReporte();
  }

  // RF-18: exportacion real del reporte filtrado (no simulada) — genera un
  // CSV en el navegador con exactamente las filas visibles en la tabla.
  function exportarCSV(){
    if(filasActuales.length === 0){
      showToast("No hay filas para exportar con estos filtros", "error");
      return;
    }
    const encabezado = ["Docente","Capacitacion","Sede","Programa","Estado","Cumplimiento","Fecha de inicio","Fecha limite","Fecha de finalizacion"];
    const filasCSV = filasActuales.map(i => {
      const fechaFin = i.fecha_finalizacion || "-";
      return [i.docente, i.capacitacion, i.sede, i.programa, badgeTexto(i.estado), semaforoTextoReporte(i), i.fecha_inscripcion || "-", i.fecha_limite || "-", fechaFin];
    });
    const escapar = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const csv = [encabezado, ...filasCSV].map(fila => fila.map(escapar).join(",")).join("\r\n");
    const blob = new Blob(["﻿" + csv], {type: "text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `reporte-certus-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast(`Reporte exportado (${filasActuales.length} filas)`, "success");
  }
  document.getElementById("btnExportarReporte").addEventListener("click", exportarCSV);

  async function cargarReporte(){
    try{
      const query = parametrosReporte();
      const respuesta = await fetch(`../api/reportes/general.php${query ? `?${query}` : ""}`, {
        credentials: "same-origin",
        headers: { "Accept": "application/json" }
      });

      let datos = null;
      try{
        datos = await respuesta.json();
      }catch(e){
        datos = { ok: false, mensaje: "Respuesta invalida del servidor." };
      }

      if(respuesta.status === 401 || respuesta.status === 403){
        try{ sessionStorage.removeItem("sesion_certus"); }catch(e){}
        if(respuesta.status === 401){
          window.location.replace(rutaLoginCertus());
          return;
        }
      }

      if(!respuesta.ok || !datos.ok){
        throw new Error(datos.mensaje || "No se pudo cargar el reporte.");
      }

      docentesReporte = datos.docentes || [];
      filasActuales = (datos.registros || []).map(normalizarRegistroReporte);
      cargarDocentesReporte();
      render();
    }catch(error){
      console.error(error);
      filasActuales = [];
      renderTablaReporte();
      showToast(error.message || "No se pudo cargar el reporte.", "error");
    }
  }

  cargarReporte();
</script>
</body>
</html>
