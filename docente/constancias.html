<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/x-icon" href="../img/favicon_certus.ico">

<title>CERTUS | Constancias</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
  <nav class="topnav">
    <div class="topnav-left"><img src="../img/certus_logo.png" alt="CERTUS" class="brand-logo"><span class="brand-divider"></span><span class="brand-label">Panel Docente</span></div>
    <div class="topnav-links">
      <a href="mis_capacitaciones.html">Mis capacitaciones</a>
      <a href="constancias.html" class="active">Constancias</a>
      <a href="mi_progreso.html">Mi progreso</a>
      <a href="mentores.html">Mentores</a>
      <a href="perfil.html">Perfil</a>
    </div>
    <div class="topnav-right" id="topnavRight"></div>
  </nav>

  <main class="main">
    <div class="topbar">
      <h1>Mis constancias</h1>
    </div>
    <p style="font-size:12.5px;color:var(--text-muted);margin:-.75rem 0 1rem;"><i class="fa-solid fa-circle-info"></i> Haz clic en una constancia para verla completa, con codigo QR de verificacion.</p>
    <div id="listaConstancias" class="constancias-grid stagger"></div>
  </main>
</div>

<div class="modal-overlay" id="modalDiploma">
  <div class="diploma-modal-inner" id="diplomaModalBox"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  const sesion = requireSesion("docente");
  const docente = DOCENTES.find(d => d.id === sesion.id);

  const misInscripcionesCompletadas = INSCRIPCIONES.filter(i => i.id_docente === sesion.id && i.estado === "completada");

  if(misInscripcionesCompletadas.length === 0){
    document.getElementById("listaConstancias").innerHTML = `
      <div class="card" style="text-align:center;padding:2.5rem 1rem;grid-column:1/-1;">
        <i class="fa-solid fa-certificate" style="font-size:34px;color:var(--secondary);margin-bottom:.75rem;display:block;"></i>
        <p style="font-size:13px;color:var(--text-muted);">Aun no tienes constancias. Se generan automaticamente al completar una capacitacion.</p>
      </div>`;
  }

  document.getElementById("listaConstancias").innerHTML = misInscripcionesCompletadas.map((i, idx) => {
    const cap = CAPACITACIONES.find(c => c.id === i.id_capacitacion);
    const constancia = CONSTANCIAS.find(c => c.id_inscripcion === i.id) || {codigo:"CERTUS-PENDIENTE", fecha_emision:"-"};
    return `
      <div class="constancia-preview" style="animation-delay:${idx * .06}s;" onclick="abrirConstancia(${i.id})">
        <div class="ribbon"><i class="fa-solid fa-award"></i></div>
        <b>${cap.titulo}</b>
        <span class="fecha">Emitida el ${constancia.fecha_emision}</span>
        <span class="codigo">${constancia.codigo}</span>
        <span class="hint"><i class="fa-solid fa-eye"></i> Ver constancia</span>
      </div>
    `;
  }).join("");

  function abrirConstancia(idInscripcion){
    const i = INSCRIPCIONES.find(x => x.id === idInscripcion);
    const cap = CAPACITACIONES.find(c => c.id === i.id_capacitacion);
    const constancia = CONSTANCIAS.find(c => c.id_inscripcion === i.id) || {codigo:"CERTUS-PENDIENTE", fecha_emision:"-"};

    document.getElementById("diplomaModalBox").innerHTML = `
      <div class="diploma">
        <div class="diploma-head">
          <div class="diploma-brandmark"><span class="diploma-logo-chip"><img src="../img/certus_logo.png" alt="CERTUS"></span></div>
          <span class="diploma-tag">Constancia de finalizacion</span>
          <div class="diploma-nombre">${docente.nombres} ${docente.apellidos}</div>
          <p class="diploma-sub">Ha completado satisfactoriamente el programa de capacitacion docente detallado a continuacion, cumpliendo con los requisitos academicos establecidos por CERTUS.</p>
        </div>
        <div class="diploma-titulo">"${cap.titulo}"</div>
        <div class="diploma-meta">
          <div><span>Duracion</span><b>${cap.duracion}</b></div>
          <div><span>Sede</span><b>${cap.sede}</b></div>
          <div><span>Emitida el</span><b>${constancia.fecha_emision}</b></div>
        </div>
        <div class="diploma-footer">
          <div class="diploma-firma">
            <div class="linea"></div>
            Direccion Academica<br><b>Instituto CERTUS</b>
          </div>
          <div class="diploma-seal"><i class="fa-solid fa-award"></i></div>
          <div class="diploma-qr">
            <div id="qr-modal"></div>
            <small>Verificar autenticidad</small>
            <div class="codigo">${constancia.codigo}</div>
          </div>
        </div>
      </div>
      <div class="diploma-actions">
        <button class="btn btn-outline btn-sm" onclick="cerrarDiploma()"><i class="fa-solid fa-xmark"></i> Cerrar</button>
        <button class="btn btn-outline btn-sm" onclick="navigator.clipboard ? (navigator.clipboard.writeText('${urlVerificacion(constancia.codigo)}'), showToast('Enlace de verificacion copiado', 'info')) : showToast('${constancia.codigo}', 'info')"><i class="fa-solid fa-link"></i> Copiar enlace</button>
        <button class="btn btn-primary btn-sm" id="btnDescargarPDF" onclick="descargarPDF(${idInscripcion})"><i class="fa-solid fa-download"></i> Descargar PDF</button>
      </div>
    `;
    document.getElementById("modalDiploma").classList.add("open");
    // RF-14 + MEJORA: el QR ahora apunta a una pagina de verificacion real
    // dentro del propio prototipo (verificar.html), inspirada en el modelo
    // de "European Digital Credentials" (Europass) y el "Educator Lookup"
    // de la CA Commission on Teacher Credentialing — no a un dominio ficticio.
    renderQR("qr-modal", urlVerificacion(constancia.codigo));
  }

  function urlVerificacion(codigo){
    return new URL(`../verificar.html?codigo=${codigo}`, location.href).href;
  }

  function cerrarDiploma(){
    document.getElementById("modalDiploma").classList.remove("open");
  }
  document.getElementById("modalDiploma").addEventListener("click", (e) => {
    if(e.target.id === "modalDiploma") cerrarDiploma();
  });

  // RF-14: descarga real de la constancia en PDF (no simulada), generada
  // en el navegador a partir del propio diseno del diploma (html2canvas + jsPDF).
  async function descargarPDF(idInscripcion){
    const i = INSCRIPCIONES.find(x => x.id === idInscripcion);
    const constancia = CONSTANCIAS.find(c => c.id_inscripcion === i.id) || {codigo:"CERTUS-PENDIENTE"};
    const el = document.querySelector("#diplomaModalBox .diploma");
    const btn = document.getElementById("btnDescargarPDF");
    if(!el || typeof html2canvas === "undefined" || !window.jspdf){
      showToast("No se pudo generar el PDF en este navegador", "error");
      return;
    }

    const original = btn.innerHTML;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generando...`;
    btn.disabled = true;

    // BUG real encontrado: el diploma tiene "animation: slideUp .4s ease
    // backwards" (efecto de aparicion). Si la captura se hacia antes de que
    // esa animacion terminara, html2canvas congelaba el diploma a mitad de
    // camino (opacidad parcial), y el PDF salia con todos los colores
    // lavados/palidos en vez de los reales. Se apaga la animacion antes de
    // capturar para que el diploma quede siempre en su estado final.
    const animacionOriginal = el.style.animation;
    el.style.animation = "none";
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await new Promise(r => setTimeout(r, 80));

    try{
      const canvas = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff" });
      const imgData = canvas.toDataURL("image/png");
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: canvas.width >= canvas.height ? "landscape" : "portrait",
        unit: "px",
        format: [canvas.width, canvas.height]
      });
      pdf.addImage(imgData, "PNG", 0, 0, canvas.width, canvas.height);
      pdf.save(`constancia-${constancia.codigo}.pdf`);
      showToast("PDF descargado correctamente", "success");
    } catch(err){
      showToast("Ocurrio un error generando el PDF", "error");
    } finally {
      el.style.animation = animacionOriginal;
      btn.innerHTML = original;
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
