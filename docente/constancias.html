<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/x-icon" href="../img/favicon_certus.ico">

<title>CERTUS | Constancias</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
  <nav class="topnav">
    <div class="topnav-left"><img src="../img/certus_logo.png" alt="CERTUS" class="brand-logo"><span class="brand-divider"></span><span class="brand-label">Panel Docente</span></div>
    <div class="topnav-links">
      <a href="mis_capacitaciones.html">Mis capacitaciones</a>
      <a href="constancias.html" class="active">Constancias</a>
      <a href="mi_progreso.html">Mi progreso</a>
      <a href="mentores.html">Mentores</a>
      <a href="perfil.html">Perfil</a>
    </div>
    <div class="topnav-right" id="topnavRight"></div>
  </nav>

  <main class="main">
    <div class="topbar">
      <h1>Mis constancias</h1>
    </div>
    <p style="font-size:12.5px;color:var(--text-muted);margin:-.75rem 0 1rem;"><i class="fa-solid fa-circle-info"></i> Haz clic en una constancia para verla completa, con codigo QR de verificacion.</p>
    <div id="listaConstancias" class="constancias-grid stagger"></div>
  </main>
</div>

<div class="modal-overlay" id="modalDiploma">
  <div class="diploma-modal-inner" id="diplomaModalBox"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  const sesion = requireSesion("docente");
  let constancias = [];
  const listaConstancias = document.getElementById("listaConstancias");

  function escaparHTML(valor){
    return String(valor ?? "").replace(/[&<>"']/g, caracter => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[caracter]));
  }

  function fechaCorta(fecha){
    return fecha ? String(fecha).slice(0, 10) : "-";
  }

  function obtenerConstancia(idInscripcion){
    return constancias.find(c => c.id_inscripcion === idInscripcion);
  }

  async function apiConstancias(ruta){
    const respuesta = await fetch(`../api/constancias/${ruta}`, {
      credentials: "same-origin",
      headers: { "Accept": "application/json" }
    });

    let datos = null;
    try{
      datos = await respuesta.json();
    }catch(e){
      datos = { ok: false, mensaje: "Respuesta invalida del servidor." };
    }

    if(respuesta.status === 401 || respuesta.status === 403){
      try{ sessionStorage.removeItem("sesion_certus"); }catch(e){}
      window.location.replace(rutaLoginCertus());
      throw new Error("Sesion no valida.");
    }

    if(!respuesta.ok || !datos.ok){
      throw new Error(datos.mensaje || "No se pudo completar la operacion.");
    }

    return datos;
  }

  function renderConstancias(){
    if(constancias.length === 0){
      listaConstancias.innerHTML = `
        <div class="card" style="text-align:center;padding:2.5rem 1rem;grid-column:1/-1;">
          <i class="fa-solid fa-certificate" style="font-size:34px;color:var(--secondary);margin-bottom:.75rem;display:block;"></i>
          <p style="font-size:13px;color:var(--text-muted);">Aun no tienes constancias. Se generan automaticamente al completar una capacitacion.</p>
        </div>`;
      return;
    }

    listaConstancias.innerHTML = constancias.map((constancia, idx) => `
      <div class="constancia-preview" style="animation-delay:${idx * .06}s;" onclick="abrirConstancia(${constancia.id_inscripcion})">
        <div class="ribbon"><i class="fa-solid fa-award"></i></div>
        <b>${escaparHTML(constancia.capacitacion)}</b>
        <span class="fecha">Finalizada el ${escaparHTML(fechaCorta(constancia.fecha_finalizacion))}</span>
        <span class="codigo">${escaparHTML(constancia.codigo)}</span>
        <span class="hint"><i class="fa-solid fa-eye"></i> Ver constancia</span>
        <button class="btn btn-primary btn-sm" style="margin-top:.75rem;" onclick="event.stopPropagation();descargarPDF(${constancia.id_inscripcion})"><i class="fa-solid fa-download"></i> Descargar PDF</button>
      </div>
    `).join("");
  }

  async function cargarConstancias(){
    try{
      const datos = await apiConstancias("mis_constancias.php");
      constancias = datos.constancias || [];
      renderConstancias();
    }catch(error){
      console.error(error);
      listaConstancias.innerHTML = `
        <div class="card" style="text-align:center;padding:2.5rem 1rem;grid-column:1/-1;">
          <i class="fa-solid fa-triangle-exclamation" style="font-size:30px;color:var(--danger);margin-bottom:.75rem;display:block;"></i>
          <p style="font-size:13px;color:var(--text-muted);">${escaparHTML(error.message || "No se pudieron cargar las constancias.")}</p>
        </div>`;
    }
  }

  function abrirConstancia(idInscripcion){
    const constancia = obtenerConstancia(idInscripcion);
    if(!constancia){
      showToast("Constancia no disponible", "error");
      return;
    }

    document.getElementById("diplomaModalBox").innerHTML = `
      <div class="diploma">
        <div class="diploma-head">
          <div class="diploma-brandmark"><span class="diploma-logo-chip"><img src="../img/certus_logo.png" alt="CERTUS"></span></div>
          <span class="diploma-tag">Constancia de finalizacion</span>
          <div class="diploma-nombre">${escaparHTML(constancia.docente)}</div>
          <p class="diploma-sub">Ha completado satisfactoriamente el programa de capacitacion docente detallado a continuacion, cumpliendo con los requisitos academicos establecidos por CERTUS.</p>
        </div>
        <div class="diploma-titulo">"${escaparHTML(constancia.capacitacion)}"</div>
        <div class="diploma-meta">
          <div><span>Duracion</span><b>${escaparHTML(constancia.duracion)}</b></div>
          <div><span>Sede</span><b>${escaparHTML(constancia.sede)}</b></div>
          <div><span>Finalizada el</span><b>${escaparHTML(fechaCorta(constancia.fecha_finalizacion))}</b></div>
        </div>
        <div class="diploma-footer">
          <div class="diploma-firma">
            <div class="linea"></div>
            Direccion Academica<br><b>Instituto CERTUS</b>
          </div>
          <div class="diploma-seal"><i class="fa-solid fa-award"></i></div>
          <div class="diploma-qr">
            <div id="qr-modal"></div>
            <small>Verificar autenticidad</small>
            <div class="codigo">${constancia.codigo}</div>
          </div>
        </div>
      </div>
      <div class="diploma-actions">
        <button class="btn btn-outline btn-sm" onclick="cerrarDiploma()"><i class="fa-solid fa-xmark"></i> Cerrar</button>
        <button class="btn btn-outline btn-sm" onclick="navigator.clipboard ? (navigator.clipboard.writeText('${urlVerificacion(constancia.codigo)}'), showToast('Enlace de verificacion copiado', 'info')) : showToast('${constancia.codigo}', 'info')"><i class="fa-solid fa-link"></i> Copiar enlace</button>
        <button class="btn btn-primary btn-sm" id="btnDescargarPDF" onclick="descargarPDF(${idInscripcion})"><i class="fa-solid fa-download"></i> Descargar PDF</button>
      </div>
    `;
    document.getElementById("modalDiploma").classList.add("open");
    // RF-14 + MEJORA: el QR ahora apunta a una pagina de verificacion real
    // dentro del propio prototipo (verificar.html), inspirada en el modelo
    // de "European Digital Credentials" (Europass) y el "Educator Lookup"
    // de la CA Commission on Teacher Credentialing — no a un dominio ficticio.
    renderQR("qr-modal", urlVerificacion(constancia.codigo));
  }

  function urlVerificacion(codigo){
    return new URL(`../verificar.html?codigo=${codigo}`, location.href).href;
  }

  function cerrarDiploma(){
    document.getElementById("modalDiploma").classList.remove("open");
  }
  document.getElementById("modalDiploma").addEventListener("click", (e) => {
    if(e.target.id === "modalDiploma") cerrarDiploma();
  });

  async function descargarPDF(idInscripcion){
    const constancia = obtenerConstancia(idInscripcion);
    const btn = document.getElementById("btnDescargarPDF");
    if(!constancia){
      showToast("Constancia no disponible", "error");
      return;
    }

    const original = btn ? btn.innerHTML : "";
    if(btn){
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generando...`;
      btn.disabled = true;
    }

    try{
      const respuesta = await fetch(`../api/constancias/descargar.php?id_inscripcion=${encodeURIComponent(idInscripcion)}`, {
        credentials: "same-origin"
      });

      if(respuesta.status === 401 || respuesta.status === 403){
        try{ sessionStorage.removeItem("sesion_certus"); }catch(e){}
        window.location.replace(rutaLoginCertus());
        return;
      }

      if(!respuesta.ok){
        let datos = null;
        try{ datos = await respuesta.json(); }catch(e){}
        throw new Error((datos && datos.mensaje) || "No se pudo descargar la constancia.");
      }

      const blob = await respuesta.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `constancia-${constancia.codigo}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast("PDF descargado correctamente", "success");
    } catch(err){
      showToast(err.message || "Ocurrio un error generando el PDF", "error");
    } finally {
      if(btn){
        btn.innerHTML = original;
        btn.disabled = false;
      }
    }
  }

  cargarConstancias();
</script>
</body>
</html>
