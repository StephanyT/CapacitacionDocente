<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/x-icon" href="../img/favicon_certus.ico">

<title>CERTUS | Perfil</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
  <nav class="topnav">
    <div class="topnav-left"><img src="../img/certus_logo.png" alt="CERTUS" class="brand-logo"><span class="brand-divider"></span><span class="brand-label">Panel Docente</span></div>
    <div class="topnav-links">
      <a href="perfil.html" class="active">Perfil</a>
      <a href="mis_capacitaciones.html">Mis capacitaciones</a>
      <a href="constancias.html">Constancias</a>
      <a href="mi_progreso.html">Mi progreso</a>
      <a href="mentores.html">Mentores</a>
    </div>
    <div class="topnav-right" id="topnavRight">
      <button class="notif-bell" type="button" aria-label="Notificaciones" title="Notificaciones"><i class="fa-solid fa-bell"></i></button>
      <button class="topnav-icon-btn" type="button" aria-label="Centro de soporte" title="Centro de soporte"><i class="fa-solid fa-headset"></i></button>
      <div class="topnav-avatar-wrap">
        <a href="../login.html" class="topnav-avatar" aria-label="Volver al login" title="Volver al login"><i class="fa-solid fa-user"></i></a>
      </div>
    </div>
  </nav>

  <main class="main">
    <!-- BLOQUE 1: Topbar (saludo) + Hero (especialidad y experiencia) -->
    <div class="topbar"><h1>Hola, <span id="nombreTopbar"></span></h1></div>

    <div class="profile-hero">
      <div class="profile-hero-top">
        <div>
          <span class="especialidad-tag" id="pEspecialidad"><i class="fa-solid fa-bullseye"></i></span>
        </div>
        <div class="especialidad-tag" id="pExperiencia"><i class="fa-solid fa-briefcase"></i></div>
      </div>
    </div>
    <!-- Los siguientes bloques (tarjeta de perfil, stats, etc.) se agregan despues -->
  </main>
</div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  // BLOQUE 1: por ahora usamos un docente fijo de prueba (id 1) en vez de
  // requireSesion("docente"), porque login.html todavia no guarda la sesion
  // real (eso lo conecta tu companero). Cuando lo haga, esta linea cambia a:
  //   const sesion = requireSesion("docente");
  //   const docente = DOCENTES.find(d => d.id === sesion.id);
  const docente = DOCENTES.find(d => d.id === 1);

  document.getElementById("nombreTopbar").textContent = docente.nombres;
  document.getElementById("pEspecialidad").innerHTML = `<i class="fa-solid fa-bullseye"></i> ${docente.especialidad}`;
  document.getElementById("pExperiencia").innerHTML = `<i class="fa-solid fa-briefcase"></i> ${docente.anios_experiencia} anos de experiencia`;
</script>
</body>
</html>
