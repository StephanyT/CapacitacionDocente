<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/x-icon" href="img/favicon_certus.ico">
<title>CERTUS | Iniciar sesion</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo-row">
      <img src="img/certus_logo.png" alt="CERTUS">
    </div>

    <div class="role-toggle">
      <button type="button" id="btnDocente" class="active">Docente</button>
      <button type="button" id="btnAdmin">Administrador</button>
    </div>

    <form method="POST" action="procesar_login.php" id="formLogin">
      <input type="hidden" name="rol" id="rolInput" value="docente">

      <input type="email" name="correo" id="correo" placeholder="correo@certus.edu.pe" required>
      
      <div class="login-pass-wrap">
        <input type="password" name="password" id="clave" placeholder="Contrasena" required>
        <button type="button" class="login-pass-toggle" id="togglePass" aria-label="Mostrar contraseña">
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>
      
      <button type="submit" class="login-submit">Acceder</button>
    </form>

    <a href="#" class="login-forgot">¿Has olvidado tu contraseña?</a>
    
    <p id="msgError" style="font-size:12px;margin-top:10px;color:#c62828;display:none;">
      Correo o contraseña incorrectos
    </p>
  </div>
</div>

<script>
  // Mostrar / ocultar contraseña
  document.getElementById("togglePass").addEventListener("click", () => {
    const clave = document.getElementById("clave");
    const icono = document.querySelector("#togglePass i");
    const visible = clave.type === "text";
    clave.type = visible ? "password" : "text";
    icono.className = visible ? "fa-regular fa-eye" : "fa-regular fa-eye-slash";
  });

  // Toggle de rol (Docente / Administrador)
  document.getElementById("btnDocente").addEventListener("click", () => {
    document.getElementById("rolInput").value = "docente";
    document.getElementById("btnDocente").classList.add("active");
    document.getElementById("btnAdmin").classList.remove("active");
  });

  document.getElementById("btnAdmin").addEventListener("click", () => {
    document.getElementById("rolInput").value = "admin";
    document.getElementById("btnAdmin").classList.add("active");
    document.getElementById("btnDocente").classList.remove("active");
  });

  // Mostrar mensaje de error si viene de la URL
  if (window.location.search.includes("error=1")) {
    document.getElementById("msgError").style.display = "block";
  }
</script>
</body>
</html>
