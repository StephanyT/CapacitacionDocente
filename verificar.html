<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/x-icon" href="img/favicon_certus.ico">

<title>CERTUS | Verificar constancia</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  body{background:var(--bg);}
  .lp-nav{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 5%;}
  .lp-nav .brand-lg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--navy);}
  .lp-nav .brand-lg i{color:var(--warning);}
  .lp-nav a.btn{padding:9px 18px;}
  .verif-wrap{max-width:520px;margin:2.5rem auto;padding:0 1.25rem;}
  .verif-box{background:var(--surface);border-radius:14px;padding:2rem;box-shadow:0 6px 24px rgba(0,0,0,.06);}
  .verif-box h1{font-size:19px;color:var(--navy);margin-bottom:.4rem;}
  .verif-box p.sub{font-size:12.5px;color:var(--text-muted);margin-bottom:1.25rem;}
  .verif-input-row{display:flex;gap:8px;}
  .verif-input-row input{flex:1;padding:10px 12px;border:1px solid var(--secondary);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);}
  .verif-resultado{margin-top:1.5rem;border-top:1px solid var(--secondary);padding-top:1.25rem;}
  .verif-ok{color:var(--success, #2e7d32);}
  .verif-error{color:#c62828;}
  .verif-kv{width:100%;font-size:13px;}
  .verif-kv td{padding:5px 0;}
  .verif-kv td:first-child{color:var(--text-muted);width:130px;}
</style>
</head>
<body>
<nav class="lp-nav">
  <a href="login.html" class="brand-lg"><i class="fa-solid fa-graduation-cap"></i> CERTUS</a>
  <a href="login.html" class="btn btn-outline"><i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar sesion</a>
</nav>

<div class="verif-wrap">
  <div class="verif-box">
    <h1><i class="fa-solid fa-shield-halved"></i> Verificar constancia</h1>
    <p class="sub">Ingresa el codigo de la constancia (por ejemplo <b>CERTUS-2026-0001</b>) para confirmar su autenticidad, como el "Educator Lookup" de un registro docente real.</p>
    <div class="verif-input-row">
      <input type="text" id="inputCodigo" placeholder="CERTUS-2026-0001">
      <button class="btn btn-primary" id="btnVerificar" type="button"><i class="fa-solid fa-magnifying-glass"></i> Verificar</button>
    </div>
    <div id="resultado" class="verif-resultado" style="display:none;"></div>
  </div>
</div>

<script src="js/data.js?v=20260916n"></script>
<script src="js/app.js?v=20260916n"></script>
<script>
(async function(){
  async function verificarCodigo(codigo){
    const resultado = document.getElementById("resultado");
    resultado.style.display = "block";
    resultado.innerHTML = `<p style="font-size:13px;color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Verificando...</p>`;

    try{
      const respuesta = await fetch(`api/constancias/verificar.php?codigo=${encodeURIComponent(codigo)}`, {
        headers: { "Accept": "application/json" }
      });
      const datos = await respuesta.json();

      if(!datos.ok){
        resultado.innerHTML = `
          <p class="verif-error"><i class="fa-solid fa-circle-xmark"></i> ${datos.mensaje || "No se encontro ninguna constancia con ese codigo."}</p>
        `;
        return;
      }

      const c = datos.constancia;
      resultado.innerHTML = `
        <p class="verif-ok"><i class="fa-solid fa-circle-check"></i> Constancia valida y emitida por CERTUS.</p>
        <table class="verif-kv">
          <tr><td>Docente</td><td><b>${c.docente}</b></td></tr>
          <tr><td>Capacitacion</td><td>${c.capacitacion}</td></tr>
          <tr><td>Duracion</td><td>${c.duracion}</td></tr>
          <tr><td>Sede</td><td>${c.sede}</td></tr>
          <tr><td>Emitida el</td><td>${c.fecha_emision}</td></tr>
          <tr><td>Codigo</td><td>${c.codigo}</td></tr>
        </table>
      `;
    }catch(e){
      resultado.innerHTML = `<p class="verif-error"><i class="fa-solid fa-triangle-exclamation"></i> No se pudo conectar con el servidor de verificacion.</p>`;
    }
  }

  document.getElementById("btnVerificar").addEventListener("click", () => {
    const codigo = document.getElementById("inputCodigo").value.trim();
    if(!codigo) return;
    verificarCodigo(codigo);
  });
  document.getElementById("inputCodigo").addEventListener("keydown", (e) => {
    if(e.key === "Enter") document.getElementById("btnVerificar").click();
  });

  const parametros = new URLSearchParams(window.location.search);
  const codigoURL = parametros.get("codigo");
  if(codigoURL){
    document.getElementById("inputCodigo").value = codigoURL;
    verificarCodigo(codigoURL);
  }
})();
</script>
</body>
</html>
